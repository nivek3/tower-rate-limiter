name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MSRV: '1.96.0'
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.10.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10


    env:
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.10.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run tests
        run: cargo test --locked
      - name: Run all-target tests
        run: cargo test --locked --all-targets --all-features
      - name: Run doc tests
        run: cargo test --locked --doc --all-features
      - name: Test core without default features
        run: cargo test --locked --no-default-features
      - name: Test Axum in isolation
        run: cargo test --locked --no-default-features --features axum
      - name: Test tracing in isolation
        run: cargo test --locked --no-default-features --features tracing
      - name: Test Memory GCRA in isolation
        run: cargo test --locked --no-default-features --features memory-gcra --test memory_gcra
      - name: Check features without default features
        run: |
          cargo check --locked --no-default-features --features memory
          cargo check --locked --no-default-features --features memory-gcra
          cargo check --locked --no-default-features --features redis
          cargo check --locked --no-default-features --features redis-lua
          cargo check --locked --no-default-features --features redis-gcra,runtime-tokio
          cargo check --locked --no-default-features --features redis-gcra,runtime-smol
          cargo check --locked --no-default-features --features postgres-gcra
          cargo check --locked --no-default-features --features runtime-tokio
          cargo check --locked --no-default-features --features runtime-smol
      - name: Check examples
        run: cargo check --locked --examples --all-features
      - name: Deny rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
      - name: Verify package
        run: cargo package --locked

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Install mdBook Mermaid
        run: cargo install mdbook-mermaid --version "${MDBOOK_MERMAID_VERSION}" --locked
      - name: Configure mdBook Mermaid
        run: mdbook-mermaid install .
      - name: Build mdBook
        run: mdbook build

  redis-test:
    name: Redis (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tokio / transaction
            features: redis,runtime-tokio
            targets: --test redis_store_tokio
          - name: Tokio / Lua
            features: redis-lua,runtime-tokio
            targets: --test redis_store_tokio
          - name: Smol / transaction
            features: redis,runtime-smol
            targets: --test redis_store_smol
          - name: Smol / Lua
            features: redis-lua,runtime-smol
            targets: --test redis_store_smol
          - name: Tokio / GCRA
            features: redis-gcra,runtime-tokio
            targets: --test redis_gcra_interfaces --test redis_gcra_tokio
          - name: Smol / GCRA
            features: redis-gcra,runtime-smol
            targets: --test redis_gcra_smol
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10


    env:
      REDIS_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.10.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Redis integration test
        run: cargo test --locked --no-default-features --features "${{ matrix.features }}" ${{ matrix.targets }}

  postgres-gcra-test:
    name: PostgreSQL / GCRA
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tower_rate_limiter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tower_rate_limiter" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/tower_rate_limiter
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.10.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run PostgreSQL GCRA integration tests
        run: cargo test --locked --no-default-features --features postgres-gcra --test postgres_gcra_interfaces --test postgres_gcra

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check MSRV
        run: cargo check --all-features

  udeps:
    name: udeps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.10.0'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-udeps
      - run: cargo +nightly udeps --workspace --lib --examples --tests --benches --all-features --locked
