[book]
title = "tower-rate-limiter"
description = "Keyed HTTP rate limiting middleware for Tower"
authors = ["nivek3"]
language = "en"
src = "docs"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/tower-rate-limiter/"
default-theme = "light"
preferred-dark-theme = "navy"

git-repository-url = "https://github.com/nivek3/tower-rate-limiter"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/nivek3/tower-rate-limiter/edit/main/docs/{path}"
no-section-label = true
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true
limit-results = 20
